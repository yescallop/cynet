# An example configuration for cynet. Run it with `cynet run cyn0.toml`.
#
# Generate keys with `cynet genkey`, `cynet pubkey` and `cynet genpsk`, which work like their
# counterparts in `wg`. This file holds a private key, so keep it private.

# The network interface, as `ip` would show it. This section and each key in it are optional.
[interface]
# Its name. Defaults to the file's stem, as in wg-quick.
name = "cyn0"
# Its MTU. Defaults to 1400.
mtu = 1400
# This node's addresses, with no prefix length: each is assigned as a /32 or /128, and advertised
# as a host route. Link-local addresses are not allowed. A node with none still forwards, and
# sources its ICMP errors from a dummy address. An address is exclusive to this node unless marked
# "nonexclusive,", for example "nonexclusive,10.42.0.9" for a service that several nodes answer on.
addresses = ["10.42.0.1", "fd42::1"]

# The WireGuard tunnels, as `wg` would show them.
[wireguard]
# This node's private key. Alternatively, private_key_file = "/etc/cynet/key".
# On Windows, use a TOML literal path: private_key_file = 'C:\Tools\cynet\private.key'.
private_key = "6Hfl9MO1R1qHVvRbQ1cMUwzIo/ZPyQ2wHyFIuKiXZnE="
# The UDP port to listen on. Defaults to a random one, which only suits a node that peers
# reach out from, rather than to.
listen_port = 51820
# Seconds between lookups of peers' hostnames. Defaults to 60, and can't be under 15; 0 disables
# them, apart from the first. A peer that is sending to this node is not looked up, as its address
# is evidently good. One that has gone quiet goes back to an address and port from the lookup.
reresolve_secs = 60

# What cynet adds to those: how traffic crosses the mesh.
[routing]
# The prefixes that make up the mesh, as far as this host is concerned: which sources it accepts
# packets from, and which destinations it sends into the mesh. Packets that merely pass through
# this node aren't filtered by this, and neither are the routes it learns and advertises, so a
# network can be extended a node at a time.
mesh = ["10.42.0.0/16", "fd42::/48", "192.168.0.0/16"]
# Directly attached networks, which are advertised. Reaching them takes kernel forwarding on this
# node, as cynet has no socket on them. A packet from a peer claiming a source in one of them is
# dropped. As with addresses, a network is exclusive to this node unless marked "nonexclusive,":
# another node advertising it too, or any prefix inside it, is a conflict. Each node keeps the route
# it learnt first, and the conflict is reported in the logs and in `cynet show` along the way. So a
# default route at an exit node must be marked, as in "nonexclusive,0.0.0.0/0", or it would conflict
# with every other node's prefix of its family.
attached = ["192.168.7.0/24"]
# Whether to add a kernel route to the main table for each entry of mesh. Defaults to true, which
# doesn't allow a /0 in mesh for now. An entry only gets a route if this node has an address or an
# attached network of its family, as nothing else here could use it, and is otherwise skipped with
# a warning. With false, cynet adds no routes at all, and warns of none.
kernel_routes = true

# One table per peer. All peers run cynet: each is a Babel neighbour.
[[peer]]
public_key = "xTIBA5rboUvnH4htodjb6e697QjLERt1NAB4mZqp8Dg="
# Optional.
preshared_key = "FpCyhws9cxwWoV4xELtfJvjJN+zQVRPISllRWgeopVE="
# Optional. An address, or a hostname, which is looked up again every reresolve_secs. A peer with
# no endpoint is reached once it has been in touch.
endpoint = "vpn.example.com:51820"

[[peer]]
public_key = "TrMvSoP4jYQlY6RIzBgbssQqY3vxI2Pi+y71lOWWXX0="
endpoint = "203.0.113.5:51820"
